<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minesweeper</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #1a1a2e;
    --surface:   #16213e;
    --panel:     #0f3460;
    --accent:    #e94560;
    --text:      #eaeaea;
    --dim:       #8892a4;
    --cell-unrev:#2a3f6f;
    --cell-rev:  #0d1b3e;
    --cell-hover:#3a5080;
    --border:    #1e3a6e;
    --flag:      #f5a623;
    --mine:      #e94560;
    --n1: #60a5fa; --n2: #4ade80; --n3: #f87171;
    --n4: #818cf8; --n5: #fb923c; --n6: #22d3ee;
    --n7: #f472b6; --n8: #94a3b8;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    gap: 20px;
  }

  h1 {
    font-size: 2rem;
    letter-spacing: .15em;
    color: var(--text);
    text-transform: uppercase;
  }
  h1 span { color: var(--accent); }

  /* Difficulty selector */
  .difficulties {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .diff-btn {
    background: var(--panel);
    border: 2px solid var(--border);
    color: var(--text);
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: .9rem;
    transition: background .15s, border-color .15s;
  }
  .diff-btn:hover    { background: var(--cell-hover); border-color: var(--accent); }
  .diff-btn.active   { border-color: var(--accent); background: var(--accent); color: #fff; }

  /* Status bar */
  .statusbar {
    display: flex;
    gap: 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 28px;
    font-size: 1.1rem;
    font-variant-numeric: tabular-nums;
    align-items: center;
  }
  .statusbar .label { color: var(--dim); font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }
  .statusbar .value { font-size: 1.3rem; font-weight: 700; margin-top: 2px; }
  .stat { display: flex; flex-direction: column; align-items: center; }

  .reset-btn {
    background: none;
    border: 2px solid var(--border);
    color: var(--text);
    font-size: 1.4rem;
    width: 42px; height: 42px;
    border-radius: 50%;
    cursor: pointer;
    transition: border-color .15s, transform .1s;
    line-height: 1;
  }
  .reset-btn:hover { border-color: var(--accent); transform: rotate(20deg); }

  /* Board */
  .board-wrap {
    overflow: auto;
    max-width: 100%;
  }
  #board {
    display: grid;
    gap: 3px;
    padding: 4px;
  }
  .cell {
    width: 36px; height: 36px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: .95rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
    transition: background .1s, transform .08s;
    background: var(--cell-unrev);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  .cell:hover:not(.revealed):not(.exploded)   { background: var(--cell-hover); }
  .cell:active:not(.revealed):not(.exploded)  { transform: scale(.92); }
  .cell.revealed  { background: var(--cell-rev); cursor: default; }
  .cell.flagged   { background: var(--cell-unrev); color: var(--flag); }
  .cell.exploded  { background: var(--mine); color: #fff; }
  .cell.mine-show { background: var(--cell-rev); color: var(--mine); }
  .cell[data-n="1"] { color: var(--n1); }
  .cell[data-n="2"] { color: var(--n2); }
  .cell[data-n="3"] { color: var(--n3); }
  .cell[data-n="4"] { color: var(--n4); }
  .cell[data-n="5"] { color: var(--n5); }
  .cell[data-n="6"] { color: var(--n6); }
  .cell[data-n="7"] { color: var(--n7); }
  .cell[data-n="8"] { color: var(--n8); }

  /* Overlay message */
  .message {
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: .05em;
    min-height: 1.8rem;
    text-align: center;
  }
  .message.won  { color: var(--n2); }
  .message.lost { color: var(--mine); }

  /* Help */
  .help {
    color: var(--dim);
    font-size: .8rem;
    text-align: center;
    line-height: 1.7;
  }
</style>
</head>
<body>

<h1>Mine<span>sweeper</span></h1>

<div class="difficulties">
  <button class="diff-btn active" data-diff="b">Beginner<br><small>9×9 · 10</small></button>
  <button class="diff-btn"        data-diff="i">Intermediate<br><small>16×16 · 40</small></button>
  <button class="diff-btn"        data-diff="e">Expert<br><small>16×30 · 99</small></button>
</div>

<div class="statusbar">
  <div class="stat"><div class="label">Mines</div><div class="value" id="mine-count">10</div></div>
  <button class="reset-btn" id="reset-btn" title="New game">↺</button>
  <div class="stat"><div class="label">Time</div><div class="value" id="timer">0</div></div>
</div>

<div class="message" id="message"></div>

<div class="board-wrap">
  <div id="board"></div>
</div>

<div class="help">
  Left-click to reveal &nbsp;·&nbsp; Right-click (or long-press) to flag &nbsp;·&nbsp; Click a number to chord
</div>

<script>
const DIFFS = {
  b: { rows: 9,  cols: 9,  mines: 10 },
  i: { rows: 16, cols: 16, mines: 40 },
  e: { rows: 16, cols: 30, mines: 99 },
};

let state = null;   // game state object
let timerInterval = null;
let currentDiff = 'b';
let longPressTimer = null;

/* ── State ─────────────────────────────────────────────────── */

function newGame(diff) {
  const { rows, cols, mines } = DIFFS[diff];
  clearInterval(timerInterval);
  state = {
    rows, cols, mines,
    cells: Array.from({ length: rows }, () =>
      Array.from({ length: cols }, () => ({
        mine: false, revealed: false, flagged: false, adjacent: 0
      }))
    ),
    phase: 'waiting',   // waiting | playing | won | lost
    flags: 0,
    startTime: null,
    elapsed: 0,
  };
  document.getElementById('mine-count').textContent = mines;
  document.getElementById('timer').textContent = '0';
  const msg = document.getElementById('message');
  msg.textContent = '';
  msg.className = 'message';
  renderBoard();
}

function neighbors(r, c) {
  const out = [];
  for (let dr = -1; dr <= 1; dr++)
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < state.rows && nc >= 0 && nc < state.cols)
        out.push([nr, nc]);
    }
  return out;
}

function placeMines(safeR, safeC) {
  const safe = new Set(
    [[safeR, safeC], ...neighbors(safeR, safeC)].map(([r, c]) => r * state.cols + c)
  );
  const pool = [];
  for (let r = 0; r < state.rows; r++)
    for (let c = 0; c < state.cols; c++)
      if (!safe.has(r * state.cols + c)) pool.push([r, c]);

  // Fisher-Yates partial shuffle
  const count = Math.min(state.mines, pool.length);
  for (let i = 0; i < count; i++) {
    const j = i + Math.floor(Math.random() * (pool.length - i));
    [pool[i], pool[j]] = [pool[j], pool[i]];
    state.cells[pool[i][0]][pool[i][1]].mine = true;
  }
  for (let r = 0; r < state.rows; r++)
    for (let c = 0; c < state.cols; c++) {
      if (!state.cells[r][c].mine)
        state.cells[r][c].adjacent = neighbors(r, c)
          .filter(([nr, nc]) => state.cells[nr][nc].mine).length;
    }
}

function reveal(r, c) {
  if (state.phase === 'waiting') {
    placeMines(r, c);
    state.phase = 'playing';
    state.startTime = Date.now();
    timerInterval = setInterval(() => {
      state.elapsed = Math.floor((Date.now() - state.startTime) / 1000);
      document.getElementById('timer').textContent = state.elapsed;
    }, 500);
  }
  if (state.phase !== 'playing') return;

  const cell = state.cells[r][c];
  if (cell.flagged || cell.revealed) return;
  cell.revealed = true;

  if (cell.mine) {
    endGame(false, r, c);
    return;
  }
  if (cell.adjacent === 0) {
    for (const [nr, nc] of neighbors(r, c)) {
      const nb = state.cells[nr][nc];
      if (!nb.revealed && !nb.flagged) reveal(nr, nc);
    }
  }
  checkWin();
}

function chord(r, c) {
  if (state.phase !== 'playing') return;
  const cell = state.cells[r][c];
  if (!cell.revealed || cell.adjacent === 0) return;
  const flagCount = neighbors(r, c).filter(([nr, nc]) => state.cells[nr][nc].flagged).length;
  if (flagCount !== cell.adjacent) return;
  for (const [nr, nc] of neighbors(r, c)) {
    const nb = state.cells[nr][nc];
    if (!nb.flagged && !nb.revealed) reveal(nr, nc);
    if (state.phase !== 'playing') return;
  }
}

function toggleFlag(r, c) {
  if (state.phase !== 'playing' && state.phase !== 'waiting') return;
  const cell = state.cells[r][c];
  if (cell.revealed) return;
  cell.flagged = !cell.flagged;
  state.flags += cell.flagged ? 1 : -1;
  document.getElementById('mine-count').textContent = state.mines - state.flags;
  updateCell(r, c);
}

function checkWin() {
  for (let r = 0; r < state.rows; r++)
    for (let c = 0; c < state.cols; c++) {
      const cell = state.cells[r][c];
      if (!cell.mine && !cell.revealed) return;
    }
  endGame(true);
}

function endGame(won, explodeR, explodeC) {
  clearInterval(timerInterval);
  state.phase = won ? 'won' : 'lost';
  const msg = document.getElementById('message');
  if (won) {
    msg.textContent = `You win! Cleared in ${state.elapsed}s 🎉`;
    msg.className = 'message won';
  } else {
    msg.textContent = 'BOOM! Better luck next time 💥';
    msg.className = 'message lost';
    // reveal all mines
    for (let r = 0; r < state.rows; r++)
      for (let c = 0; c < state.cols; c++)
        if (state.cells[r][c].mine) state.cells[r][c].revealed = true;
  }
  renderBoard(won ? null : [explodeR, explodeC]);
}

/* ── Rendering ──────────────────────────────────────────────── */

function renderBoard(exploded) {
  const board = document.getElementById('board');
  board.style.gridTemplateColumns = `repeat(${state.cols}, 36px)`;
  board.innerHTML = '';

  for (let r = 0; r < state.rows; r++) {
    for (let c = 0; c < state.cols; c++) {
      const el = document.createElement('div');
      el.className = 'cell';
      el.dataset.r = r;
      el.dataset.c = c;
      setCellContent(el, r, c, exploded && exploded[0] === r && exploded[1] === c);
      attachCellHandlers(el);
      board.appendChild(el);
    }
  }
}

function setCellContent(el, r, c, isExploded) {
  const cell = state.cells[r][c];
  el.className = 'cell';
  el.textContent = '';
  el.removeAttribute('data-n');

  if (cell.revealed) {
    if (cell.mine) {
      el.classList.add(isExploded ? 'exploded' : 'mine-show');
      el.textContent = '💣';
    } else if (cell.adjacent > 0) {
      el.classList.add('revealed');
      el.dataset.n = cell.adjacent;
      el.textContent = cell.adjacent;
    } else {
      el.classList.add('revealed');
    }
  } else if (cell.flagged) {
    el.classList.add('flagged');
    el.textContent = '🚩';
  }
}

function updateCell(r, c) {
  const board = document.getElementById('board');
  const idx = r * state.cols + c;
  const el = board.children[idx];
  if (el) setCellContent(el, r, c, false);
}

function attachCellHandlers(el) {
  // Left click → reveal or chord
  el.addEventListener('click', e => {
    e.preventDefault();
    const r = +el.dataset.r, c = +el.dataset.c;
    const cell = state.cells[r][c];
    if (cell.revealed) {
      chord(r, c);
    } else {
      reveal(r, c);
    }
    if (state.phase === 'playing' || state.phase === 'waiting') {
      renderBoard();
    }
  });

  // Right click → flag
  el.addEventListener('contextmenu', e => {
    e.preventDefault();
    toggleFlag(+el.dataset.r, +el.dataset.c);
  });

  // Long press → flag (mobile)
  el.addEventListener('touchstart', e => {
    longPressTimer = setTimeout(() => {
      longPressTimer = null;
      toggleFlag(+el.dataset.r, +el.dataset.c);
    }, 500);
  }, { passive: true });

  el.addEventListener('touchend', () => {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  });

  el.addEventListener('touchmove', () => {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  });
}

/* ── Controls ───────────────────────────────────────────────── */

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentDiff = btn.dataset.diff;
    newGame(currentDiff);
  });
});

document.getElementById('reset-btn').addEventListener('click', () => newGame(currentDiff));

// Start
newGame('b');
</script>
</body>
</html>
